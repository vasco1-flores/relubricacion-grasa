<title>Inicio Lubricación MAPA</title>
<style>
:root{--bg:#f3f2ef;--surface:#fff;--fg:#1d2325;--muted:#5f6b6d;--line:#d9dcd8;--accent:#a8660f;--bad:#b3372b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141819;--surface:#1c2123;--fg:#e4e8e6;--muted:#98a3a4;--line:#2e3537;--accent:#e0a14a;--bad:#f08a7e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
.ey{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{width:100%;font:500 15px ui-monospace,Menlo,Consolas,monospace;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--accent)}
label.r{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{font:600 15px system-ui,sans-serif;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.3em;font-size:13px;color:var(--bad)}
</style></head><body>
<form id="f" autocomplete="off" action="javascript:void(0)">

  <button type="submit" id="b">Entrar</button>

</form>

    if($('rec').checked){try{localStorage.setItem(KEY,b64(raw))}catch(e){}}
    $('msg').textContent='Abriendo…';setTimeout(function(){mostrar(html)},30);
  });
})();
